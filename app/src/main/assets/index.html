<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mirror</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden}
#wrap{position:absolute;top:0;left:0;right:0;bottom:96px;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;touch-action:none;background:#111}
#bar{position:absolute;left:0;right:0;bottom:0;height:96px;background:#1c1c1e;padding:6px}
#keys{display:flex}
#keys button{flex:1;margin:2px;padding:10px 0;font-size:15px;border:0;border-radius:8px;background:#3a3a3c;color:#fff}
#txt{display:flex;margin-top:4px}
#txt input{flex:1;margin:2px;padding:8px;font-size:16px;border-radius:8px;border:0}
#txt button{margin:2px;padding:8px 12px;font-size:15px;border:0;border-radius:8px;background:#0a84ff;color:#fff}
#st{position:absolute;top:4px;left:6px;font-size:11px;opacity:.6}
</style>
</head>
<body>
<div id="st">...</div>
<div id="wrap"><canvas id="c" width="360" height="780"></canvas></div>
<div id="bar">
  <div id="keys">
    <button data-k="back">Back</button>
    <button data-k="home">Home</button>
    <button data-k="recents">Recents</button>
  </div>
  <div id="txt">
    <input id="v" type="text" placeholder="Ketik teks...">
    <button id="send">Kirim</button>
    <button id="del">&#9003;</button>
  </div>
</div>
<script>
(function () {
  // Ditulis dengan sintaks ES5 supaya jalan di Safari iOS 12.
  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  var st = document.getElementById('st');
  var m = location.search.match(/[?&]t=([^&]+)/);
  var token = m ? m[1] : '';
  var ws, busy = false;

  function send(o) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
  }

  function connect() {
    ws = new WebSocket('ws://' + location.host + '/?t=' + token);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { st.textContent = 'Terhubung'; };
    ws.onclose = function () { st.textContent = 'Terputus, mencoba lagi...'; setTimeout(connect, 2000); };
    ws.onmessage = function (e) {
      if (busy) return;           // lewati frame jika masih menggambar
      busy = true;
      var url = URL.createObjectURL(new Blob([e.data], { type: 'image/jpeg' }));
      var img = new Image();
      img.onload = function () {
        if (c.width !== img.width || c.height !== img.height) {
          c.width = img.width; c.height = img.height;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        busy = false;
      };
      img.onerror = function () { URL.revokeObjectURL(url); busy = false; };
      img.src = url;
    };
  }

  function pos(t) {
    var r = c.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (t.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (t.clientY - r.top) / r.height))
    };
  }

  var start = null, last = null;
  var opt = { passive: false };
  c.addEventListener('touchstart', function (e) {
    e.preventDefault();
    last = pos(e.touches[0]);
    start = { p: last, t: Date.now() };
  }, opt);
  c.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (start) last = pos(e.touches[0]);
  }, opt);
  c.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (!start) return;
    send({ t: 'g', x1: start.p.x, y1: start.p.y, x2: last.x, y2: last.y, d: Date.now() - start.t });
    start = null;
  }, opt);

  var keys = document.querySelectorAll('#keys button');
  for (var i = 0; i < keys.length; i++) {
    keys[i].addEventListener('click', function () {
      send({ t: 'key', k: this.getAttribute('data-k') });
    });
  }
  var v = document.getElementById('v');
  document.getElementById('send').addEventListener('click', function () {
    if (v.value) { send({ t: 'text', v: v.value }); v.value = ''; }
  });
  document.getElementById('del').addEventListener('click', function () {
    send({ t: 'del' });
  });

  connect();
})();
</script>
</body>
</html>
